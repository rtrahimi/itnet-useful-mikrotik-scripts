services:
  update:
    build: .
    image: itnet-addresslist-generator:latest
    network_mode: host
    volumes:
      - /opt/itnet-useful-mikrotik-scripts:/data/repo
      - /root/itnet-addresslist-generator/data/work:/data/work
      - /root/itnet-addresslist-generator/data/lock:/data/lock
      - /root/.ssh/itnet_useful_mikrotik_scripts_deploy:/run/secrets/git_deploy_key:ro
    environment:
      SCRIPTS_REPO_URL: git@github.com:rtrahimi/itnet-useful-mikrotik-scripts.git
      SCRIPTS_REPO_DIR: /data/repo
      SCRIPTS_BRANCH: main
      WORK_ROOT: /data/work
      LOCK_FILE: /data/lock/itnet-useful-mikrotik-scripts.lock
      GIT_DEPLOY_KEY: /run/secrets/git_deploy_key
      COMMIT_NAME: Morteza Rahimi
      COMMIT_EMAIL: rtrahimi@gmail.com
    # usage: docker compose run --rm update spamhaus
